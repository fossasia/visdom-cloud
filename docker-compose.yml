# Full visdom-cloud stack. Every credential, port, and URL is supplied from the
# environment (copy .env.docker.example to .env and edit that one file) — nothing
# is hardcoded here, so swapping config is a single-file change.

# Shared by every visdom instance; they differ only in name. The explicit image
# tag means the build runs once and the rest are cache hits.
x-visdom: &visdom
  build:
    context: ${VISDOM_CONTEXT}
  image: visdom-cloud-visdom:local
  restart: unless-stopped
  environment:
    VISDOM_PORT: ${VISDOM_PORT}
    VISDOM_BASE_URL: ${VISDOM_BASE_URL}
    VISDOM_ENV_PATH: ${VISDOM_ENV_PATH}
    VISDOM_GATEWAY_URL: http://gateway:${GATEWAY_PORT}
  volumes:
    - visdom_data:${VISDOM_ENV_PATH}
  depends_on:
    - gateway

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: ${GATEWAY_PORT}
    depends_on:
      db:
        condition: service_healthy

  # One visdom process saturates one core, so capacity comes from running several
  # and routing each workspace consistently to one of them (see deploy/
  # nginx.conf.template). They share a volume safely because a workspace is only
  # ever served by the instance its slug hashes to, so no two instances write the
  # same files. Keep VISDOM_SERVERS in .env in step with the services here.
  visdom-1:
    <<: *visdom
  visdom-2:
    <<: *visdom
  visdom-3:
    <<: *visdom

  proxy:
    build:
      context: .
      dockerfile: deploy/proxy.Dockerfile
    restart: unless-stopped
    environment:
      NGINX_PORT: ${NGINX_PORT}
      GATEWAY_HOST: gateway
      GATEWAY_PORT: ${GATEWAY_PORT}
      VISDOM_SERVERS: ${VISDOM_SERVERS}
    ports:
      - "${PUBLIC_PORT}:${NGINX_PORT}"
    depends_on:
      - gateway
      - visdom-1
      - visdom-2
      - visdom-3

  # Load generator for bench/. Profile-gated, so a plain `docker compose up` never
  # starts it; see bench/README.md.
  bench:
    profiles: ["bench"]
    build:
      context: ./bench
    environment:
      BENCH_SERVER: http://proxy
      BENCH_PORT: ${NGINX_PORT}
      BENCH_BASE_URL: ${VISDOM_BASE_URL}
      VISDOM_API_KEY: ${VISDOM_API_KEY:-}
      BENCH_EMAIL: ${BENCH_EMAIL:-}
      BENCH_PASSWORD: ${BENCH_PASSWORD:-}
    depends_on:
      - proxy

volumes:
  db_data:
  visdom_data:
